# Deploys GitHub Pages: main at the site root, plus one branch under /dev/.
#
# Publish a branch at /dev/: Actions → "Publish dev" → Run workflow → pick the branch in "Use workflow from".
# A push to main redeploys the site and rebuilds /dev/ from the branch last published there,
# as long as that branch still exists.

name: Publish dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      # a manual run publishes the branch it was started on; a push to main keeps the one already on /dev/
      - id: dev
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            branch="$REF_NAME"
          else
            branch="$(curl -fsSL "$BASE_URL/dev/branch.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -n "$branch" ] && ! git -C _site ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::warning::Branch '$branch' no longer exists, so /dev/ is left out."
              branch=""
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - if: steps.dev.outputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.dev.outputs.branch }}
          path: _site/dev

      - env:
          BRANCH: ${{ steps.dev.outputs.branch }}
        run: |
          rm -rf _site/.git _site/.github _site/dev/.git _site/dev/.github
          if [ -n "$BRANCH" ]; then printf '%s\n' "$BRANCH" > _site/dev/branch.txt; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
