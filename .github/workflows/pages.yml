# Publishes a branch under /dev/ on GitHub Pages, with main at the site root.
# Actions → "Publish dev" → Run workflow → pick the branch in "Use workflow from".

name: Publish dev

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - uses: actions/checkout@v4
        with:
          path: _site/dev

      - run: rm -rf _site/.git _site/.github _site/dev/.git _site/dev/.github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
